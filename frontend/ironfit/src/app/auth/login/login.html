<div class="ironfit-root">
    <section class="auth-layout">
        <article class="auth-card">
        <div class="auth-logo">
            <img src="assets/ironfit/logo-vertical.png" alt="IronFit - Activa tu potencial" />
        </div>

        <div class="auth-content">
            <h1 class="auth-title">Bienvenido a IronFit</h1>
            <p class="auth-subtitle">
            Inicia sesión para <span>auditar entrenamientos, asistencia y progreso</span>.
            </p>

            <form class="auth-form" (ngSubmit)="login()">
            <div class="auth-field">
                <label class="auth-label" for="usuario">Correo</label>
                <input
                id="usuario"
                name="usuario"
                type="text"
                [(ngModel)]="usuario"
                class="auth-input"
                placeholder="Correo@ironfit.com"
                autocomplete="username"
                />
            </div>

            <div class="auth-field">
                <label class="auth-label" for="password">Contraseña</label>
                <div class="password-field">
                <input
                    id="password"
                    name="password"
                    [type]="mostrarPassword ? 'text' : 'password'"
                    [(ngModel)]="clave"
                    class="auth-input"
                    placeholder="Contraseña"
                    autocomplete="current-password"
                />
                <span (click)="togglePassword()" class="toggle">
                    👁
                </span>
                </div>
            </div>

            <div class="auth-actions">
                <button type="submit" class="auth-button">
                Ingresar
                </button>

                <div *ngIf="mensajeError" class="auth-error">
                {{ mensajeError }}
                </div>
            </div>
            </form>

            <div class="auth-footer">
            Proyecto académico <strong>IronFit</strong> · Auditoría de planes y rutinas
            </div>
        </div>
        </article>
    </section>
</div>
